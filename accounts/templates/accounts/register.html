<!-- accounts/templates/accounts/register.html -->
{% extends 'base.html' %}

{% block title %}Inscription - Ma Boutique{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4"><i class="bi bi-person-plus"></i> Inscription</h3>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Nom d'utilisateur</label>
                            <input type="text" name="username" id="id_username" 
                                   class="form-control" placeholder="Choisissez un nom d'utilisateur" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_password1" class="form-label">Mot de passe</label>
                            <input type="password" name="password1" id="id_password1" 
                                   class="form-control" placeholder="Créez un mot de passe" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_password2" class="form-label">Confirmer le mot de passe</label>
                            <input type="password" name="password2" id="id_password2" 
                                   class="form-control" placeholder="Confirmez votre mot de passe" required>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 mb-3">
                            <i class="bi bi-person-plus"></i> S'inscrire
                        </button>
                        
                        <p class="text-center text-muted">
                            Déjà inscrit ? 
                            <a href="{% url 'accounts:login' %}" class="text-decoration-none">Se connecter</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
