<!-- accounts/templates/accounts/login.html -->
{% extends 'base.html' %}

{% block title %}Connexion - Ma Boutique{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> Connexion</h3>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Nom d'utilisateur</label>
                            <input type="text" name="username" id="id_username" 
                                   class="form-control" placeholder="Entrez votre nom d'utilisateur" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Mot de passe</label>
                            <input type="password" name="password" id="id_password" 
                                   class="form-control" placeholder="Entrez votre mot de passe" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="bi bi-box-arrow-in-right"></i> Se connecter
                        </button>
                        
                        <p class="text-center text-muted">
                            Pas encore de compte ? 
                            <a href="{% url 'accounts:register' %}" class="text-decoration-none">S'inscrire</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
